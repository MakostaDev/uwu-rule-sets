x-behaviors:
  x-domain: &domain
    behavior: domain
  x-ipcidr: &ipcidr
    behavior: ipcidr

x-formats:
  x-raw: &raw
    format: raw
  x-url: &url
    format: url

x-torrent-trackers-raw: &torrent-trackers-raw
  - https://raw.githubusercontent.com/sakib-m/Pi-hole-Torrent-Blocklist/refs/heads/main/all-torrent-trackers.txt

x-torrent-trackers-url: &torrent-trackers-url
  - https://raw.githubusercontent.com/XIU2/TrackersListCollection/refs/heads/master/all.txt
  - https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_all.txt
  - https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_all_http.txt
  - https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_all_https.txt
  - https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_all_i2p.txt
  - https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_all_ip.txt
  - https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_all_udp.txt
  - https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_all_ws.txt
  - https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_all_yggdrasil.txt
  - https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_all_yggdrasil_ip.txt
  - https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_best.txt
  - https://raw.githubusercontent.com/ngosang/trackerslist/refs/heads/master/trackers_best_ip.txt
  - https://raw.githubusercontent.com/adysec/tracker/refs/heads/main/trackers_all.txt
  - https://raw.githubusercontent.com/Tunglies/TrackersList/refs/heads/main/all.txt
  - https://raw.githubusercontent.com/GuangYu-yu/Tracker-URL/refs/heads/main/all.txt

rule-sets:
  - name: torrent-trackers
    <<: [*domain, *raw]
    urls: *torrent-trackers-raw

  - name: torrent-trackers
    <<: [*domain, *url]
    urls: *torrent-trackers-url

  - name: torrent-trackers
    <<: [*ipcidr, *raw]
    urls: *torrent-trackers-raw

  - name: torrent-trackers
    <<: [*ipcidr, *url]
    urls: *torrent-trackers-url
